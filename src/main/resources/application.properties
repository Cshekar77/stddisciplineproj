spring.application.name=student-discipline-system
# ──────────────────────────────────────────────────────────────────────────────
# Student Discipline System — Application Properties
# Member 6 owns this file. Update DB credentials before running.
# ──────────────────────────────────────────────────────────────────────────────

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Application Name ──────────────────────────────────────────────────────────
spring.application.name=student-discipline-system

# ── Database (Clever Cloud MySQL) ─────────────────────────────────────────────
# Replace the placeholders below with your actual Clever Cloud credentials.
# These can be found in your Clever Cloud dashboard under Environment Variables.

spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT}/${MYSQL_ADDON_DB}?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update  → keeps existing data, adds new columns/tables automatically
# create  → drops and recreates on every restart (use only during early dev)
# validate→ only checks schema, never modifies (use in production)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Spring Security ───────────────────────────────────────────────────────────
# Default login page is handled by AuthController + SecurityConfig.
# Uncomment and set if you want a default in-memory user for testing:
# spring.security.user.name=admin
# spring.security.user.password=admin123

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.studentdiscipline=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ── Local Development Override ────────────────────────────────────────────────
# If running locally without Clever Cloud env vars, comment out the Clever Cloud
# block above and uncomment + fill in the lines below:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/student_discipline?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
