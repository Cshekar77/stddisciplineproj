spring.application.name=student-discipline-system

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.tomcat.connection-timeout=20000

# ── Faster startup ────────────────────────────────────────────────────────────
spring.main.lazy-initialization=true
spring.jmx.enabled=false

# ── Database (SQLite) ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:/data/student_discipline.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── HikariCP Connection Pool (SQLite only supports 1 connection) ──────────────
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=0

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ── Thymeleaf ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging (minimal for speed) ───────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.com.studentdiscipline=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN