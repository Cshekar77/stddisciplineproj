<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity History</title>
</head>
<body>
    <h1>Activity History</h1>
    
    <form method="get">
        <input type="text" name="search" placeholder="Search..." th:value="${search}"/>
        <select name="role">
            <option value="">All Roles</option>
            <option value="ADMIN">Admin</option>
            <option value="TEACHER">Teacher</option>
            <option value="STUDENT">Student</option>
        </select>
        <button type="submit">Filter</button>
        <a href="/admin/activity-history">Clear</a>
    </form>

    <table border="1">
        <thead>
            <tr><th>Timestamp</th><th>User</th><th>Role</th><th>Action</th></tr>
        </thead>
        <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.timestamp}">-</td>
                <td><span th:if="${log.user}" th:text="${log.user.firstName + ' ' + log.user.lastName}"></span><span th:if="${log.user == null}">System</span></td>
                <td><span th:if="${log.user}" th:text="${log.user.role}"></span><span th:if="${log.user == null}">SYSTEM</span></td>
                <td th:text="${log.description}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="4">No activity logs found</td>
            </tr>
        </tbody>
    </table>
    
    <br/>
    <a href="/admin/dashboard">Back to Dashboard</a>
</body>
</html>
