<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Student Discipline System</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0d0f14;--surface:#151820;--surface2:#1c2030;--border:#252a3a;
      --accent:#4f7fff;--accent2:#ff6b6b;--accent3:#43d9a2;--accent4:#f7c948;
      --text:#e8eaf2;--muted:#7a829a;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

    .login-wrapper{width:100%;max-width:440px;}

    .brand{text-align:center;margin-bottom:32px;}
    .brand-icon{width:56px;height:56px;background:rgba(79,127,255,.15);border:1px solid rgba(79,127,255,.3);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 16px;}
    .brand-title{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text);}
    .brand-sub{font-size:.85rem;color:var(--muted);margin-top:4px;}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;}

    /* Role Tabs */
    .role-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:28px;}
    .role-tab{padding:10px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;}
    .role-tab .tab-icon{font-size:1.2rem;}
    .role-tab:hover{border-color:var(--accent);color:var(--text);}
    .role-tab.active-admin{background:rgba(79,127,255,.12);border-color:var(--accent);color:var(--accent);}
    .role-tab.active-teacher{background:rgba(67,217,162,.12);border-color:var(--accent3);color:var(--accent3);}
    .role-tab.active-student{background:rgba(247,201,72,.12);border-color:var(--accent4);color:var(--accent4);}

    .role-hint{font-size:.78rem;color:var(--muted);margin-bottom:20px;padding:10px 14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--accent);display:none;}
    .role-hint.show{display:block;}

    .form-group{margin-bottom:18px;}
    .form-label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;}
    .form-control{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:border-color .18s;}
    .form-control:focus{border-color:var(--accent);}
    .form-control::placeholder{color:var(--muted);}

    .btn-login{width:100%;padding:12px;border-radius:10px;border:none;font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;}
    .btn-admin{background:var(--accent);color:#fff;}
    .btn-admin:hover{background:#3a6eef;}
    .btn-teacher{background:var(--accent3);color:#0d0f14;}
    .btn-teacher:hover{background:#32c48d;}
    .btn-student{background:var(--accent4);color:#0d0f14;}
    .btn-student:hover{background:#e6b93a;}

    .alert{padding:11px 16px;border-radius:8px;font-size:.85rem;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .alert-error{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.25);color:var(--accent2);}
    .alert-success{background:rgba(67,217,162,.12);border:1px solid rgba(67,217,162,.25);color:var(--accent3);}

    .divider{text-align:center;color:var(--muted);font-size:.78rem;margin:20px 0;position:relative;}
    .divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border);}
    .divider::before{left:0;}
    .divider::after{right:0;}

    .footer-note{text-align:center;font-size:.78rem;color:var(--muted);margin-top:20px;}
  </style>
</head>
<body>

<div class="login-wrapper">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">🏫</div>
    <div class="brand-title">Student Discipline System</div>
    <div class="brand-sub">Sign in to your account</div>
  </div>

  <div class="card">

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert-error">
      ❌ Invalid username or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
      ✅ You have been logged out successfully.
    </div>

    <!-- Role Tabs -->
    <div class="role-tabs">
      <button type="button" class="role-tab active-admin" onclick="selectRole('admin')">
        <span class="tab-icon">🛡️</span> Admin
      </button>
      <button type="button" class="role-tab" onclick="selectRole('teacher')">
        <span class="tab-icon">👩‍🏫</span> Teacher
      </button>
      <button type="button" class="role-tab" onclick="selectRole('student')">
        <span class="tab-icon">🎓</span> Student
      </button>
    </div>

    <!-- Role Hint -->
    <div class="role-hint show" id="roleHint">
      Sign in as <strong>Admin</strong> to manage the system.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" placeholder="Enter your username" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Enter your password" required/>
      </div>
      <button type="submit" class="btn-login btn-admin" id="loginBtn">Sign In as Admin</button>
    </form>

    <div class="divider">secure login</div>
    <div class="footer-note">Contact your administrator if you forgot your credentials.</div>

  </div>
</div>

<script>
  const roles = {
    admin: {
      label: 'Admin',
      hint: 'Sign in as <strong>Admin</strong> to manage the system.',
      btnClass: 'btn-admin',
      btnText: 'Sign In as Admin',
      tabClass: 'active-admin'
    },
    teacher: {
      label: 'Teacher',
      hint: 'Sign in as <strong>Teacher</strong> to manage students and incidents.',
      btnClass: 'btn-teacher',
      btnText: 'Sign In as Teacher',
      tabClass: 'active-teacher'
    },
    student: {
      label: 'Student',
      hint: 'Sign in as <strong>Student</strong> to view your discipline record.',
      btnClass: 'btn-student',
      btnText: 'Sign In as Student',
      tabClass: 'active-student'
    }
  };

  function selectRole(role) {
    const tabs = document.querySelectorAll('.role-tab');
    tabs.forEach(t => t.className = 'role-tab');

    const idx = ['admin', 'teacher', 'student'].indexOf(role);
    tabs[idx].classList.add(roles[role].tabClass);

    const hint = document.getElementById('roleHint');
    hint.innerHTML = roles[role].hint;
    hint.classList.add('show');

    const btn = document.getElementById('loginBtn');
    btn.className = 'btn-login ' + roles[role].btnClass;
    btn.textContent = roles[role].btnText;
  }
</script>
</body>
</html>
